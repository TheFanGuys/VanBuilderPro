<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourcing queue — missing specs</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121a22; --panel2:#0e151c; --line:#22303d;
    --ink:#e7eef5; --muted:#8499ab; --faint:#5d7085; --steel:#3a4a5a;
    --hi:#f87171; --med:#f5a524; --lo:#5fa8ff; --done:#34d399;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(1100px 560px at 82% -12%,#16222e 0,transparent 60%),var(--bg);
    color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;padding-bottom:48px}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .lbl{font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--faint)}

  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 22px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:34px;height:34px;border:2px solid var(--steel);border-radius:6px;display:grid;place-items:center;background:var(--panel);position:relative}
  .mark::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:3px}
  .mark span{font-family:ui-monospace,monospace;font-weight:800;color:var(--med);font-size:15px}
  h1{font-size:17px;margin:0;font-weight:800}
  .prog{margin-left:auto;min-width:230px}
  .bar{height:7px;border-radius:4px;background:#1a2630;border:1px solid var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--done),#10b981);transition:width .25s}
  .progrow{display:flex;justify-content:space-between;margin-bottom:4px}
  .count{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint)}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 2px}
  .chip{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.04em;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.12s}
  .chip:hover{border-color:var(--steel);color:var(--ink)}
  .chip[aria-pressed="true"]{background:#1c2a36;border-color:var(--med);color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:14px}

  .order{background:linear-gradient(180deg,#16202a,#111922);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .order.clear{opacity:.55}
  .ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 13px 10px;border-bottom:1px solid var(--line)}
  .ostream{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .otitle{font-size:14px;font-weight:700;line-height:1.25;margin-top:2px}
  .pbadge{font-family:ui-monospace,monospace;font-size:9px;font-weight:700;letter-spacing:.08em;border:1px solid;border-radius:5px;padding:3px 7px;white-space:nowrap}
  .pbadge.high{color:var(--hi);border-color:var(--hi)}
  .pbadge.medium{color:var(--med);border-color:var(--med)}
  .pbadge.low{color:var(--lo);border-color:var(--lo)}
  .pbadge.done{color:var(--done);border-color:var(--done)}

  .rows{padding:6px 6px 9px}
  .row{display:flex;gap:9px;align-items:flex-start;padding:7px 7px;border-radius:7px;cursor:pointer;transition:.1s}
  .row:hover{background:#0e161e}
  .box{width:16px;height:16px;border:1.5px solid var(--steel);border-radius:4px;margin-top:1px;flex-shrink:0;display:grid;place-items:center}
  .row.done .box{background:var(--done);border-color:var(--done)}
  .row.done .box::after{content:"✓";color:#06281c;font-size:11px;font-weight:800}
  .row.done .field{text-decoration:line-through;color:var(--faint)}
  .field{font-size:12.5px;font-weight:600}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.high{background:var(--hi)}.dot.medium{background:var(--med)}.dot.low{background:var(--lo)}
  .hint{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--muted);margin-top:2px}
  .why{font-size:10.5px;color:var(--faint);margin-top:1px}

  .reset{margin-top:18px;font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);background:none;border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
  .reset:hover{color:var(--ink);border-color:var(--steel)}
  .foot{color:var(--faint);font-size:12px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  @media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>

const TASKS = Q.tasks;

const done = new Set(JSON.parse(localStorage.getItem("sq_done")||"[]"));
const save = ()=> localStorage.setItem("sq_done", JSON.stringify([...done]));

const state = { stream:"all", pri:"all", make:"all" };
const titleCase = s => (s||"").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const makes = ["all", ...[...new Set(TASKS.filter(t=>t.make).map(t=>t.make))].sort()];

function chips(elId, vals, key, fmt){
  const el=document.getElementById(elId); el.innerHTML="";
  vals.forEach(v=>{
    const b=document.createElement("button"); b.className="chip";
    b.textContent = fmt?fmt(v):v; b.setAttribute("aria-pressed", state[key]===v);
    b.onclick=()=>{ state[key]=v; render(); };
    el.appendChild(b);
  });
}

function visible(t){
  if(state.stream!=="all" && t.stream!==state.stream) return false;
  if(state.pri!=="all" && t.priority!==state.pri) return false;
  if(state.make!=="all" && t.make!==state.make) return false;
  return true;
}

const PRANK={high:0,medium:1,low:2};

function render(){
  // refresh chip pressed states
  chips("streamChips",["all","van_spec","component_spec"],"stream",v=>v==="all"?"All streams":v==="van_spec"?"Van specs":"Component specs");
  chips("priChips",["all","high","medium","low"],"pri",v=>v==="all"?"All priorities":titleCase(v));
  chips("makeChips",makes,"make",v=>v==="all"?"All makes":v);

  const list=TASKS.filter(visible);
  // group by target
  const groups=new Map();
  for(const t of list){
    if(!groups.has(t.target)) groups.set(t.target,{label:t.target_label,stream:t.stream,make:t.make,tasks:[]});
    groups.get(t.target).tasks.push(t);
  }
  // sort groups: any open high first, then by target
  const arr=[...groups.values()].map(g=>{
    g.tasks.sort((a,b)=>PRANK[a.priority]-PRANK[b.priority]);
    g.open=g.tasks.filter(t=>!done.has(t.id)).length;
    g.topPri=g.open? g.tasks.find(t=>!done.has(t.id)).priority : "done";
    return g;
  }).sort((a,b)=> (a.open===0)-(b.open===0) || PRANK[a.topPri]-PRANK[b.topPri] || a.label.localeCompare(b.label));

  document.getElementById("grid").innerHTML = arr.map(g=>{
    const cleared = g.open===0;
    return `<section class="order ${cleared?'clear':''}">
      <div class="ohead">
        <div><div class="ostream">${g.stream==="van_spec"?(g.make||"Van")+" · van spec":"Component spec"}</div>
          <div class="otitle">${g.label}</div></div>
        <span class="pbadge ${g.topPri}">${cleared?"CLEARED":g.open+" OPEN"}</span>
      </div>
      <div class="rows">
        ${g.tasks.map(t=>{
          const d=done.has(t.id);
          return `<div class="row ${d?'done':''}" data-id="${t.id}">
            <div class="box"></div>
            <div>
              <div class="field"><span class="dot ${t.priority}"></span>${t.field_label}</div>
              <div class="hint">${t.source_hint}</div>
              <div class="why">${t.why}</div>
            </div></div>`;
        }).join("")}
      </div></section>`;
  }).join("") || `<div class="foot">Nothing matches these filters.</div>`;

  document.querySelectorAll(".row").forEach(r=>r.onclick=()=>{
    const id=r.dataset.id; done.has(id)?done.delete(id):done.add(id); save(); render();
  });

  const total=TASKS.length, cleared=TASKS.filter(t=>done.has(t.id)).length;
  document.getElementById("pct").textContent=Math.round(cleared/total*100)+"%";
  document.getElementById("fill").style.width=(cleared/total*100)+"%";
  document.getElementById("ptext").textContent=cleared+" of "+total+" specs collected";
}

document.getElementById("reset").onclick=()=>{ if(confirm("Clear all checkmarks?")){done.clear();save();render();} };
document.getElementById("foot").innerHTML =
  `${Q.summary.total} open tasks · ${Q.summary.by_priority.high} high / ${Q.summary.by_priority.medium} medium / ${Q.summary.by_priority.low} low. `+
  `Generated from ${Q.source}. High-priority items are weights and axle data the planner needs for GVWR/axle warnings — pull from the order guide, body-builder guide, or the door-jamb sticker. Check off as you collect.`;
render();
</script>
