<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van Models — spec catalog</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121a22; --panel2:#0e151c; --line:#22303d;
    --ink:#e7eef5; --muted:#8499ab; --faint:#5d7085;
    --steel:#3a4a5a; --amber:#f5a524; --green:#34d399; --red:#f87171; --blue:#5fa8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #16222e 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    padding-bottom:48px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .lbl{font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--faint)}

  /* header */
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:34px;height:34px;border:2px solid var(--steel);border-radius:6px;display:grid;place-items:center;position:relative;background:var(--panel)}
  .mark::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:3px}
  .mark span{font-family:ui-monospace,monospace;font-weight:800;font-size:15px;color:var(--amber)}
  h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.02em}
  h1 + div{margin-top:1px}
  .prog{margin-left:auto;min-width:210px}
  .bar{height:7px;border-radius:4px;background:#1a2630;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#10b981)}
  .progrow{display:flex;justify-content:space-between;margin-bottom:4px}

  /* controls */
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.04em;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;user-select:none;
    -webkit-tap-highlight-color:transparent;transition:.12s}
  .chip:hover{border-color:var(--steel);color:var(--ink)}
  .chip[aria-pressed="true"]{background:#1c2a36;border-color:var(--amber);color:var(--ink)}
  .grow{flex:1 1 160px}
  input[type=search]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    padding:9px 12px;font:13px/1 ui-monospace,monospace;outline:none}
  input[type=search]:focus{border-color:var(--steel)}
  .count{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);white-space:nowrap}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}

  /* the signature: a stamped certification plate */
  .plate{position:relative;background:linear-gradient(180deg,#16202a,#111922);border:1px solid var(--line);
    border-radius:10px;padding:14px 14px 12px;cursor:pointer;transition:.14s;overflow:hidden}
  .plate:hover{border-color:var(--steel);transform:translateY(-1px)}
  .plate::before,.plate::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#6b7e8f,#2a3744);top:9px}
  .plate::before{left:9px}.plate::after{right:9px}
  .ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 6px}
  .pmake{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .pmodel{font-size:19px;font-weight:800;letter-spacing:.01em;line-height:1.1;margin-top:2px}
  .pdesig{font-family:ui-monospace,monospace;color:var(--amber);font-weight:700}
  .ptrim{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);margin:7px 6px 0}

  /* status stamp */
  .stamp{font-family:ui-monospace,monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-align:center;
    border:2px solid;border-radius:5px;padding:4px 7px;transform:rotate(3deg);line-height:1.15;white-space:nowrap;opacity:.92}
  .stamp.v{color:var(--green);border-color:var(--green)}
  .stamp.n{color:var(--amber);border-color:var(--amber)}

  .specrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 0}
  .cell{background:#0d141b;border:1px solid var(--line);border-radius:6px;padding:6px 7px;text-align:center}
  .cell b{font-family:ui-monospace,monospace;font-size:13px;font-weight:700;display:block}
  .cell .lbl{margin-bottom:2px}

  .weights{margin:11px 6px 0;border-top:1px dashed var(--line);padding-top:9px}
  .wline{display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,monospace;font-size:11.5px;padding:2px 0}
  .wline .k{color:var(--muted)}
  .ok{color:var(--green)}
  .miss{color:var(--amber);opacity:.85}

  /* detail drawer */
  dialog{border:none;background:transparent;padding:0;max-width:100%;max-height:100%}
  dialog::backdrop{background:rgba(4,8,11,.74);backdrop-filter:blur(2px)}
  .sheet{width:min(560px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--steel);
    border-radius:14px;padding:18px;margin:auto}
  .sheet h2{margin:0;font-size:18px}
  .kv{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-family:ui-monospace,monospace;font-size:12.5px;margin-top:12px}
  .kv .k{color:var(--muted)}
  .kv .vmiss{color:var(--amber)}
  .src{margin-top:14px}
  .src a{color:var(--blue);text-decoration:none;font-size:12px;word-break:break-all}
  .tag{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.04em;color:var(--amber);
    border:1px solid #5a4218;background:#241a08;border-radius:4px;padding:2px 6px;margin:3px 4px 0 0}
  .close{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;
    padding:5px 11px;font-family:ui-monospace,monospace;font-size:12px;cursor:pointer}
  .footnote{color:var(--faint);font-size:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
  @media (max-width:430px){ .specrow{grid-template-columns:repeat(2,1fr)} .pmodel{font-size:18px} }
</style>
</head>

const ROWS = CATALOG.van_models;
const REQUIRED = CATALOG.required_fields;

const state = JSON.parse(localStorage.getItem("vm_filters")||"{}");
state.make ??= "All"; state.body ??= "All"; state.roof ??= "All"; state.q ??= "";

const uniq = (k) => ["All", ...[...new Set(ROWS.map(r=>r[k]))].sort()];
const titleCase = (s)=> (s||"").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());

function chipRow(elId, values, key){
  const el = document.getElementById(elId);
  el.innerHTML = "";
  values.forEach(v=>{
    const b = document.createElement("button");
    b.className="chip"; b.textContent = key==="make" ? v : titleCase(v);
    b.setAttribute("aria-pressed", state[key]===v);
    b.onclick = ()=>{ state[key]=v; persist(); render(); syncChips(); };
    el.appendChild(b);
  });
}
function syncChips(){
  [["makeChips","make"],["bodyChips","body"],["roofChips","roof"]].forEach(([id,key])=>{
    [...document.getElementById(id).children].forEach(b=>{
      const val = b.textContent==="All" ? "All" : b.dataset.v;
    });
  });
  // simplest: re-render chip pressed states
  document.querySelectorAll("#makeChips .chip").forEach(b=>b.setAttribute("aria-pressed", (b.textContent===state.make)));
  document.querySelectorAll("#bodyChips .chip").forEach(b=>b.setAttribute("aria-pressed", (titleCase(state.body)===b.textContent)|| (state.body==="All"&&b.textContent==="All")));
  document.querySelectorAll("#roofChips .chip").forEach(b=>b.setAttribute("aria-pressed", (titleCase(state.roof)===b.textContent)|| (state.roof==="All"&&b.textContent==="All")));
}
function persist(){ localStorage.setItem("vm_filters", JSON.stringify(state)); }

function match(r){
  if(state.make!=="All" && r.make!==state.make) return false;
  if(state.body!=="All" && r.body_style!==state.body) return false;
  if(state.roof!=="All" && r.roof!==state.roof) return false;
  if(state.q){
    const s = (r.trim+" "+r.model+" "+r.model_designation+" "+r.wheelbase_in+" "+r.body_style+" "+r.roof).toLowerCase();
    if(!s.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

const num = (n)=> n==null ? null : Number(n).toLocaleString();
function wline(k,val,unit){
  const has = val!=null;
  return `<div class="wline"><span class="k">${k}</span>
    <span class="${has?'ok':'miss'}">${has? num(val)+(unit||'') : '— needs verify'}</span></div>`;
}

function plateHTML(r){
  const v = r.complete;
  const stamp = v ? `<div class="stamp v">VERIFIED</div>`
                  : `<div class="stamp n">NEEDS<br>VERIFICATION</div>`;
  return `<article class="plate" data-id="${r.id}">
    <div class="ptop">
      <div>
        <div class="pmake">${r.make}</div>
        <div class="pmodel">${r.model} <span class="pdesig">${r.model_designation}</span></div>
      </div>
      ${stamp}
    </div>
    <div class="ptrim">${r.roof_label} · ${r.wheelbase_in}" WB · ${titleCase(r.body_style)} · ${r.drivetrain}/${r.rear_wheels}</div>
    <div class="specrow">
      <div class="cell"><div class="lbl">Len</div><b>${r.interior_L_in??'—'}"</b></div>
      <div class="cell"><div class="lbl">Wid</div><b>${r.interior_W_in??'—'}"</b></div>
      <div class="cell"><div class="lbl">Ht</div><b>${r.interior_H_in??'—'}"</b></div>
      <div class="cell"><div class="lbl">WB</div><b>${r.wheelbase_in}"</b></div>
    </div>
    <div class="weights">
      ${wline("GVWR", r.gvwr_lb, " lb")}
      ${gawrLine(r)}
      ${wline("Curb (per axle)", r.curb_front_lb, " lb")}
    </div>
  </article>`;
}
function gawrLine(r){
  const has = r.gawr_front_lb!=null && r.gawr_rear_lb!=null;
  return `<div class="wline"><span class="k">GAWR front / rear</span>
    <span class="${has?'ok':'miss'}">${has? num(r.gawr_front_lb)+" / "+num(r.gawr_rear_lb)+" lb" : '— needs verify'}</span></div>`;
}

function render(){
  const list = ROWS.filter(match);
  document.getElementById("grid").innerHTML = list.map(plateHTML).join("") ||
    `<div class="footnote">No configurations match these filters. Clear a filter to see more.</div>`;
  document.getElementById("resultCount").textContent = list.length+" / "+ROWS.length+" configs";
  document.querySelectorAll(".plate").forEach(p=> p.onclick=()=>openDetail(p.dataset.id));
  // search box
}

function fieldRows(r){
  const order = ["make","model","model_designation","trim","body_style","roof","length_class",
    "wheelbase_in","drivetrain","rear_wheels","exterior_height_in","interior_L_in","interior_W_in",
    "interior_H_in","between_wheelwells_in","front_axle_to_interior_front_in","gvwr_lb","gawr_front_lb",
    "gawr_rear_lb","curb_front_lb","curb_rear_lb","payload_lb"];
  return order.map(k=>{
    const val = r[k];
    const miss = (val==null||val==="");
    const req = REQUIRED.includes(k);
    const disp = miss ? (req?"needs verification":"—") : val;
    return `<div class="k">${k}${req?' ★':''}</div><div class="${miss&&req?'vmiss':''}">${disp}</div>`;
  }).join("");
}

function openDetail(id){
  const r = ROWS.find(x=>x.id===id);
  const miss = (r.missing_required||[]).map(m=>`<span class="tag">${m}</span>`).join("") || '<span class="ok mono">all required fields filled</span>';
  const srcs = (r.provenance.sources||[]).filter(s=>s.url).map(s=>`<div><a href="${s.url}" target="_blank" rel="noopener">${s.label}</a></div>`).join("");
  document.getElementById("sheet").innerHTML = `
    <button class="close" onclick="document.getElementById('detail').close()">close</button>
    <div class="pmake">${r.make}</div>
    <h2>${r.model} ${r.model_designation} <span class="pdesig">·</span> ${r.roof_label}</h2>
    <div class="ptrim" style="margin-left:0">${r.trim}</div>
    <div class="kv">${fieldRows(r)}</div>
    <div class="src">
      <div class="lbl">Still to collect</div>
      <div style="margin-top:6px">${miss}</div>
    </div>
    <div class="src">
      <div class="lbl">Confidence · ${r.provenance.confidence} · weights ${r.provenance.weights_source}</div>
      <div style="margin-top:6px">${srcs||'<span class="mono" style="color:var(--faint)">no source link on file</span>'}</div>
    </div>
    <div class="footnote" style="margin-top:14px">★ = required for a complete row. Weights & axle offset come from the order/upfitter guide or the door-jamb sticker — not invented.</div>`;
  document.getElementById("detail").showModal();
}

// init
chipRow("makeChips", uniq("make"), "make");
chipRow("bodyChips", uniq("body_style"), "body");
chipRow("roofChips", uniq("roof"), "roof");
const q = document.getElementById("q");
q.value = state.q;
q.oninput = ()=>{ state.q=q.value; persist(); render(); };

const done = ROWS.filter(r=>r.complete).length;
document.getElementById("pct").textContent = Math.round(done/ROWS.length*100)+"%";
document.getElementById("barfill").style.width = (done/ROWS.length*100)+"%";
document.getElementById("progtext").textContent = done+" of "+ROWS.length+" configs fully specced";
document.getElementById("foot").innerHTML =
  `${ROWS.length} attested configurations across ${new Set(ROWS.map(r=>r.model)).size} models. `+
  `Configs and dimensions are sourced; weights and axle offset are flagged for the spec agent to verify per vehicle. `+
  `Tap any plate for the full field list and sources.`;

syncChips(); render();
</script>
